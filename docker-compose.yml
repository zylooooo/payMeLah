services:
  postgres:
    image: postgres:16-alpine
    container_name: paymelah-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - paymelah-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: paymelah-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./src:/app:rw
      - ./src/logs:/app/logs
    networks:
      - paymelah-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  paymelah-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local